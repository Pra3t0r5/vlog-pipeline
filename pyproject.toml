[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vlog-pipeline"
version = "0.2.0"
description = "Pipeline para armar videos de viaje desde material en bruto: inventario, triage, edición por listas de cortes y render con caché."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ImageHash==4.3.2",
    "librosa==1.0.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pillow_heif==1.8.1",
    "PyYAML==6.0.3",
    "scipy==1.18.1",
    "soundfile==0.14.0",
]

[tool.setuptools]
py-modules = []
